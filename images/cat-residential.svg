<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Residential interior design floor plan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="680" fill="#211D18"/>
<g opacity="0.92">
  <rect x="46" y="46" width="808" height="588" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <line x1="86" y1="46" x2="112" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="268" y1="46" x2="294" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="450" y1="46" x2="476" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="632" y1="46" x2="658" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="814" y1="46" x2="840" y2="46" stroke="#A8823F" stroke-width="3"/>

  <!-- outer walls -->
  <rect x="150" y="130" width="600" height="420" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <!-- bedroom / bath / closet divisions -->
  <line x1="480" y1="130" x2="480" y2="330" stroke="#DFC790" stroke-width="1.3"/>
  <line x1="480" y1="330" x2="750" y2="330" stroke="#DFC790" stroke-width="1.3"/>
  <line x1="360" y1="330" x2="360" y2="550" stroke="#DFC790" stroke-width="1" stroke-dasharray="2 5"/>

  <!-- bed -->
  <rect x="192" y="180" width="150" height="200" fill="none" stroke="#A8823F" stroke-width="1.3"/>
  <rect x="192" y="180" width="150" height="34" fill="none" stroke="#A8823F" stroke-width="1"/>
  <rect x="200" y="222" width="60" height="34" fill="none" stroke="#A8823F" stroke-width="0.8"/>
  <rect x="272" y="222" width="60" height="34" fill="none" stroke="#A8823F" stroke-width="0.8"/>

  <!-- wardrobe -->
  <rect x="192" y="410" width="168" height="40" fill="none" stroke="#DFC790" stroke-width="1.2"/>
  <line x1="276" y1="410" x2="276" y2="450" stroke="#DFC790" stroke-width="0.8"/>

  <!-- washroom fixtures -->
  <rect x="520" y="150" width="60" height="90" fill="none" stroke="#5C7368" stroke-width="1.2"/>
  <circle cx="640" cy="180" r="26" fill="none" stroke="#5C7368" stroke-width="1.1"/>
  <rect x="600" y="220" width="90" height="46" fill="none" stroke="#5C7368" stroke-width="1"/>
  <path d="M 480 300 A 40 40 0 0 1 520 260" fill="none" stroke="#5C7368" stroke-width="0.8" stroke-dasharray="2 4"/>

  <!-- living / seating area -->
  <rect x="400" y="390" width="140" height="60" fill="none" stroke="#A8823F" stroke-width="1.1"/>
  <circle cx="590" cy="420" r="24" fill="none" stroke="#A8823F" stroke-width="1"/>
  <rect x="560" y="470" width="150" height="50" fill="none" stroke="#DFC790" stroke-width="1.1"/>

  <!-- door swing -->
  <line x1="360" y1="550" x2="360" y2="510" stroke="#DFC790" stroke-width="1"/>
  <path d="M 360 550 A 40 40 0 0 0 400 510" fill="none" stroke="#DFC790" stroke-width="0.8" stroke-dasharray="2 5"/>

  <text x="46" y="666" font-family="monospace" font-size="11" fill="#DFC790" text-anchor="start">A-102 · SCALE 1:50</text>
  <text x="854" y="32" font-family="monospace" font-size="12" fill="#A8823F" text-anchor="end" font-weight="bold">RESIDENTIAL</text>
</g>
</svg>
