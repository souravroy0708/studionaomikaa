<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hotel interior design floor plan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="680" fill="#211D18"/>
<g opacity="0.92">
  <rect x="46" y="46" width="808" height="588" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <line x1="86" y1="46" x2="112" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="268" y1="46" x2="294" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="450" y1="46" x2="476" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="632" y1="46" x2="658" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="814" y1="46" x2="840" y2="46" stroke="#A8823F" stroke-width="3"/>

  <!-- corridor -->
  <rect x="140" y="120" width="620" height="70" fill="none" stroke="#DFC790" stroke-width="1.3" stroke-dasharray="2 5"/>
  <text x="450" y="160" font-family="monospace" font-size="10" fill="#8A8172" text-anchor="middle" letter-spacing="3">CORRIDOR</text>

  <!-- guest room outer wall -->
  <rect x="180" y="190" width="540" height="360" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <line x1="500" y1="190" x2="500" y2="360" stroke="#DFC790" stroke-width="1.2"/>
  <line x1="500" y1="360" x2="720" y2="360" stroke="#DFC790" stroke-width="1.2"/>

  <!-- bed with pillows -->
  <rect x="220" y="230" width="180" height="220" fill="none" stroke="#A8823F" stroke-width="1.3"/>
  <rect x="230" y="240" width="70" height="40" fill="none" stroke="#A8823F" stroke-width="0.9"/>
  <rect x="310" y="240" width="70" height="40" fill="none" stroke="#A8823F" stroke-width="0.9"/>
  <!-- side tables -->
  <rect x="192" y="245" width="24" height="30" fill="none" stroke="#DFC790" stroke-width="0.9"/>
  <rect x="404" y="245" width="24" height="30" fill="none" stroke="#DFC790" stroke-width="0.9"/>

  <!-- ensuite washroom -->
  <rect x="530" y="210" width="80" height="120" fill="none" stroke="#5C7368" stroke-width="1.1"/>
  <circle cx="660" cy="240" r="24" fill="none" stroke="#5C7368" stroke-width="1"/>
  <rect x="620" y="270" width="80" height="46" fill="none" stroke="#5C7368" stroke-width="1"/>

  <!-- dressing / TV unit -->
  <rect x="530" y="400" width="180" height="34" fill="none" stroke="#DFC790" stroke-width="1"/>
  <text x="620" y="422" font-family="monospace" font-size="9" fill="#8A8172" text-anchor="middle">TV UNIT</text>

  <!-- seating nook -->
  <circle cx="250" cy="500" r="26" fill="none" stroke="#A8823F" stroke-width="1"/>
  <rect x="300" y="480" width="70" height="40" fill="none" stroke="#A8823F" stroke-width="1"/>

  <!-- entry door -->
  <line x1="180" y1="480" x2="180" y2="440" stroke="#DFC790" stroke-width="1"/>
  <path d="M 180 480 A 40 40 0 0 1 220 440" fill="none" stroke="#DFC790" stroke-width="0.8" stroke-dasharray="2 5"/>

  <text x="46" y="666" font-family="monospace" font-size="11" fill="#DFC790" text-anchor="start">A-201 · SCALE 1:50</text>
  <text x="854" y="32" font-family="monospace" font-size="12" fill="#A8823F" text-anchor="end" font-weight="bold">HOTEL</text>
</g>
</svg>
