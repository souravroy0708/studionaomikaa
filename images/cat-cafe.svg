<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cafe interior design floor plan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="680" fill="#211D18"/>
<g opacity="0.92">
  <rect x="46" y="46" width="808" height="588" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <line x1="86" y1="46" x2="112" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="268" y1="46" x2="294" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="450" y1="46" x2="476" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="632" y1="46" x2="658" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="814" y1="46" x2="840" y2="46" stroke="#A8823F" stroke-width="3"/>

  <!-- outer wall -->
  <rect x="140" y="120" width="620" height="440" fill="none" stroke="#DFC790" stroke-width="1.6"/>

  <!-- kitchen / back of house -->
  <line x1="140" y1="230" x2="330" y2="230" stroke="#DFC790" stroke-width="1.2"/>
  <line x1="330" y1="120" x2="330" y2="230" stroke="#DFC790" stroke-width="1.2"/>
  <g stroke="#5C7368" stroke-width="1">
    <rect x="160" y="140" width="150" height="30" fill="none"/>
    <rect x="160" y="180" width="60" height="40" fill="none"/>
    <circle cx="270" cy="200" r="18" fill="none"/>
  </g>
  <text x="235" y="215" font-family="monospace" font-size="8" fill="#8A8172" text-anchor="middle">KITCHEN</text>

  <!-- service counter -->
  <rect x="340" y="150" width="220" height="46" fill="none" stroke="#A8823F" stroke-width="1.3"/>
  <line x1="400" y1="150" x2="400" y2="196" stroke="#A8823F" stroke-width="0.9"/>
  <line x1="460" y1="150" x2="460" y2="196" stroke="#A8823F" stroke-width="0.9"/>
  <line x1="520" y1="150" x2="520" y2="196" stroke="#A8823F" stroke-width="0.9"/>
  <text x="450" y="180" font-family="monospace" font-size="8" fill="#211D18" text-anchor="middle">COUNTER</text>

  <!-- queue line dashed -->
  <line x1="340" y1="215" x2="560" y2="215" stroke="#DFC790" stroke-width="0.8" stroke-dasharray="2 5"/>

  <!-- seating: round tables with chairs -->
  <g stroke="#DFC790" stroke-width="1">
    <circle cx="220" cy="310" r="28" fill="none"/>
    <circle cx="220" cy="270" r="6" fill="none"/><circle cx="220" cy="350" r="6" fill="none"/>
    <circle cx="180" cy="310" r="6" fill="none"/><circle cx="260" cy="310" r="6" fill="none"/>

    <circle cx="340" cy="310" r="28" fill="none"/>
    <circle cx="340" cy="270" r="6" fill="none"/><circle cx="340" cy="350" r="6" fill="none"/>
    <circle cx="300" cy="310" r="6" fill="none"/><circle cx="380" cy="310" r="6" fill="none"/>

    <circle cx="460" cy="310" r="28" fill="none"/>
    <circle cx="460" cy="270" r="6" fill="none"/><circle cx="460" cy="350" r="6" fill="none"/>
    <circle cx="420" cy="310" r="6" fill="none"/><circle cx="500" cy="310" r="6" fill="none"/>
  </g>

  <!-- banquette seating along back wall -->
  <rect x="580" y="230" width="150" height="40" fill="none" stroke="#A8823F" stroke-width="1.1"/>
  <line x1="580" y1="270" x2="580" y2="420" stroke="#A8823F" stroke-width="1.1"/>
  <rect x="600" y="290" width="40" height="30" fill="none" stroke="#DFC790" stroke-width="0.8"/>
  <rect x="600" y="340" width="40" height="30" fill="none" stroke="#DFC790" stroke-width="0.8"/>
  <rect x="600" y="390" width="40" height="30" fill="none" stroke="#DFC790" stroke-width="0.8"/>

  <!-- more seating grid -->
  <g stroke="#DFC790" stroke-width="1">
    <circle cx="220" cy="430" r="28" fill="none"/>
    <circle cx="220" cy="390" r="6" fill="none"/><circle cx="220" cy="470" r="6" fill="none"/>
    <circle cx="180" cy="430" r="6" fill="none"/><circle cx="260" cy="430" r="6" fill="none"/>

    <circle cx="340" cy="430" r="28" fill="none"/>
    <circle cx="340" cy="390" r="6" fill="none"/><circle cx="340" cy="470" r="6" fill="none"/>
    <circle cx="300" cy="430" r="6" fill="none"/><circle cx="380" cy="430" r="6" fill="none"/>
  </g>

  <!-- entry door -->
  <line x1="450" y1="560" x2="450" y2="520" stroke="#DFC790" stroke-width="1"/>
  <path d="M 450 560 A 40 40 0 0 0 490 520" fill="none" stroke="#DFC790" stroke-width="0.8" stroke-dasharray="2 5"/>

  <text x="46" y="666" font-family="monospace" font-size="11" fill="#DFC790" text-anchor="start">A-401 · SCALE 1:75</text>
  <text x="854" y="32" font-family="monospace" font-size="12" fill="#A8823F" text-anchor="end" font-weight="bold">CAFÉ &amp; RETAIL</text>
</g>
</svg>
