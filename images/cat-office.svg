<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Office interior design floor plan" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="900" height="680" fill="#211D18"/>
<g opacity="0.92">
  <rect x="46" y="46" width="808" height="588" fill="none" stroke="#DFC790" stroke-width="1.6"/>
  <line x1="86" y1="46" x2="112" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="268" y1="46" x2="294" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="450" y1="46" x2="476" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="632" y1="46" x2="658" y2="46" stroke="#A8823F" stroke-width="3"/>
  <line x1="814" y1="46" x2="840" y2="46" stroke="#A8823F" stroke-width="3"/>

  <!-- outer wall -->
  <rect x="140" y="120" width="620" height="440" fill="none" stroke="#DFC790" stroke-width="1.6"/>

  <!-- reception at left -->
  <line x1="270" y1="120" x2="270" y2="260" stroke="#DFC790" stroke-width="1.2"/>
  <path d="M 200 220 Q 240 190 270 220" fill="none" stroke="#A8823F" stroke-width="1.2"/>
  <text x="205" y="250" font-family="monospace" font-size="9" fill="#8A8172">RECEPTION</text>

  <!-- open workstation grid -->
  <g stroke="#A8823F" stroke-width="1">
    <rect x="300" y="150" width="50" height="50" fill="none"/>
    <rect x="360" y="150" width="50" height="50" fill="none"/>
    <rect x="420" y="150" width="50" height="50" fill="none"/>
    <rect x="480" y="150" width="50" height="50" fill="none"/>
    <rect x="300" y="220" width="50" height="50" fill="none"/>
    <rect x="360" y="220" width="50" height="50" fill="none"/>
    <rect x="420" y="220" width="50" height="50" fill="none"/>
    <rect x="480" y="220" width="50" height="50" fill="none"/>
  </g>

  <!-- meeting room -->
  <rect x="560" y="140" width="180" height="150" fill="none" stroke="#DFC790" stroke-width="1.3"/>
  <ellipse cx="650" cy="215" rx="60" ry="30" fill="none" stroke="#5C7368" stroke-width="1.1"/>
  <text x="650" y="310" font-family="monospace" font-size="9" fill="#8A8172" text-anchor="middle">MEETING ROOM</text>

  <!-- breakout / focus pods -->
  <rect x="180" y="330" width="130" height="90" fill="none" stroke="#5C7368" stroke-width="1.1"/>
  <circle cx="220" cy="375" r="16" fill="none" stroke="#5C7368" stroke-width="0.9"/>
  <circle cx="270" cy="375" r="16" fill="none" stroke="#5C7368" stroke-width="0.9"/>

  <!-- more workstations lower row -->
  <g stroke="#A8823F" stroke-width="1">
    <rect x="350" y="340" width="50" height="50" fill="none"/>
    <rect x="410" y="340" width="50" height="50" fill="none"/>
    <rect x="470" y="340" width="50" height="50" fill="none"/>
  </g>

  <!-- cabin / director office -->
  <rect x="580" y="330" width="160" height="90" fill="none" stroke="#DFC790" stroke-width="1.2"/>
  <rect x="600" y="350" width="80" height="40" fill="none" stroke="#A8823F" stroke-width="1"/>

  <!-- corridor dashed -->
  <line x1="140" y1="440" x2="760" y2="440" stroke="#DFC790" stroke-width="1" stroke-dasharray="2 5"/>

  <text x="46" y="666" font-family="monospace" font-size="11" fill="#DFC790" text-anchor="start">A-301 · SCALE 1:100</text>
  <text x="854" y="32" font-family="monospace" font-size="12" fill="#A8823F" text-anchor="end" font-weight="bold">OFFICE</text>
</g>
</svg>
